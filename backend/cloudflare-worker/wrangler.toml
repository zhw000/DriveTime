name = "drivetime-amap-proxy"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# Secrets are NOT stored here. Set them with:
#   npx wrangler secret put AMAP_KEY
#   npx wrangler secret put PROXY_ACCESS_TOKEN   # optional but recommended
#
# Optional persistent rate limiting:
# 1. npx wrangler kv namespace create DRIVETIME_RATE_LIMIT
# 2. Uncomment and paste the returned namespace id below.
#
# [[kv_namespaces]]
# binding = "DRIVETIME_KV"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
RATE_LIMIT_PER_MINUTE = "20"
# Optional browser origins allowed by CORS for local web debugging:
# ALLOWED_ORIGINS = "http://localhost:5173"
