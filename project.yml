name: DriveTime
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "26.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CLANG_ENABLE_MODULES: YES
    DEAD_CODE_STRIPPING: YES
targets:
  DriveTime:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DriveTime
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: DriveTime
        PRODUCT_BUNDLE_IDENTIFIER: com.example.drivetime
        INFOPLIST_FILE: DriveTime/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_CFBundleDisplayName: DriveTime
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: targeted
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  DriveTimeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DriveTimeTests
    dependencies:
      - target: DriveTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.drivetime.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DriveTime.app/DriveTime"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  DriveTime:
    build:
      targets:
        DriveTime: all
        DriveTimeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DriveTimeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
