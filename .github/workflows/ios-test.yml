name: iOS Simulator Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.6"
  XCODEGEN_VERSION: "2.48.0"

jobs:
  simulator-tests:
    name: Simulator build & XCTest
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select and report toolchain
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes
          swift --version

      - name: Install XcodeGen (pinned)
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo PREFIX=/usr/local /tmp/xcodegen/xcodegen/install.sh
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Discover and boot an installed iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          UDID="$(python3 scripts/pick-simulator.py)"
          [[ -n "$UDID" ]] || { echo "No simulator UDID discovered" >&2; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build app and test bundles for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project DriveTime.xcodeproj \
            -scheme DriveTime \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build-for-testing \
            build-for-testing 2>&1 | tee build-test.log

      - name: Run XCTest unit tests
        id: unit_tests
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project DriveTime.xcodeproj \
            -scheme DriveTime \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build-for-testing \
            -only-testing:DriveTimeTests \
            -parallel-testing-enabled NO \
            -resultBundlePath UnitResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            2>&1 | tee unit-test.log

      - name: Run XCTest UI tests
        id: ui_tests
        continue-on-error: true
        timeout-minutes: 18
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project DriveTime.xcodeproj \
            -scheme DriveTime \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build-for-testing \
            -only-testing:DriveTimeUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath UIResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 90 \
            -maximum-test-execution-time-allowance 180 \
            2>&1 | tee ui-test.log

      - name: Summarize XCTest results
        if: always()
        run: |
          set -euo pipefail
          if [ -d UnitResults.xcresult ]; then
            xcrun xcresulttool get test-results summary \
              --path UnitResults.xcresult 2>/dev/null | tee unit-test-summary.json || true
          fi
          if [ -d UIResults.xcresult ]; then
            xcrun xcresulttool get test-results summary \
              --path UIResults.xcresult 2>/dev/null | tee ui-test-summary.json || true
          fi

      - name: Export UI test screenshots
        if: always()
        run: |
          set -euo pipefail
          mkdir -p ui-test-attachments
          if [ -d UIResults.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path UIResults.xcresult \
              --output-path ui-test-attachments || true
          fi
          find ui-test-attachments -maxdepth 2 -type f -print || true

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DriveTime-simulator-tests-${{ github.run_number }}
          path: |
            UnitResults.xcresult
            UIResults.xcresult
            unit-test.log
            ui-test.log
            build-test.log
            unit-test-summary.json
            ui-test-summary.json
            ui-test-attachments
            DriveTime.xcodeproj
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce test results
        if: always()
        run: |
          echo "Unit tests outcome: ${{ steps.unit_tests.outcome }}"
          echo "UI tests outcome:   ${{ steps.ui_tests.outcome }}"
          if [ "${{ steps.unit_tests.outcome }}" != "success" ]; then
            echo "Unit tests did not pass." >&2
            exit 1
          fi
          if [ "${{ steps.ui_tests.outcome }}" != "success" ]; then
            echo "UI tests did not pass." >&2
            exit 1
          fi
